name: Update Airing Posts

on:
  schedule:
    # Runs 4 times during peak release window (6:00 PM to 12:00 AM IST):
    # Note: Uses minute 28 instead of 30 to avoid GitHub Actions global traffic congestion at :30
    # - 12:28 UTC = 05:58 PM IST (~06:00 PM)
    # - 14:28 UTC = 07:58 PM IST (~08:00 PM)
    # - 16:28 UTC = 09:58 PM IST (~10:00 PM)
    # - 18:28 UTC = 11:58 PM IST (~12:00 AM Midnight)
    - cron: '28 12,14,16,18 * * *'
  workflow_dispatch:  # also lets you trigger it manually from the GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 rapidfuzz lxml

      - name: Set timezone to Asia/Kolkata (IST)
        run: sudo timedatectl set-timezone Asia/Kolkata

      - name: Write empty settings.json (headless script will fill it from env)
        run: echo '{}' > settings.json

      - name: Run airing post updater
        env:
          WP_URL:              ${{ secrets.WP_URL }}
          WP_USERNAME:         ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD:     ${{ secrets.WP_APP_PASSWORD }}
          TMDB_API_KEY:        ${{ secrets.TMDB_API_KEY }}
          TOONSTREAM_DOMAINS:  ${{ secrets.TOONSTREAM_DOMAINS }}
          MULTIMOVIES_DOMAINS: ${{ secrets.MULTIMOVIES_DOMAINS }}
          WORKER_BASE:         ${{ secrets.WORKER_BASE }}
          ANIMEDEKHO_URL:      ${{ secrets.ANIMEDEKHO_URL }}
        run: python run_airing_headless.py
